[build-system]
requires = ["setuptools>=69,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "wind3dgs"
version = "0.1.0.dev0"
description = "Topology-distilled global-local wind dynamics for static 3D Gaussian thin surfaces"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]
teacher = [
  "PyYAML>=6,<7",
  "scipy>=1.10,<2",
]
teacher-contact = [
  "PyYAML>=6,<7",
  "scipy>=1.10,<2",
  "ipctk==1.6.0",
]
teacher-contact-samples = [
  "wind3dgs[teacher-contact]",
  "matplotlib>=3.9,<4",
]
teacher-gpu = [
  "PyYAML>=6,<7",
  "scipy>=1.10,<2",
  "warp-lang>=1.17,<1.18",
]
teacher-gpu-solver = [
  "PyYAML>=6,<7",
  "scipy>=1.10,<2",
  "warp-lang>=1.17,<1.18",
  "cupy-cuda12x>=13.6,<14",
]
teacher-gpu-resident = [
  "PyYAML>=6,<7",
  "scipy>=1.10,<2",
  "warp-lang>=1.17,<1.18",
  "nvidia-cudss-cu12==0.7.1.6",
]
learning = [
  "torch>=2.0",
]
render = [
  "Pillow>=10,<13",
  "gsplat>=1.5,<1.6",
  "torch>=2.0",
]
legacy-viewer = [
  "glcontext==3.0.0",
  "glfw==2.10.0",
  "moderngl==5.12.0",
  "Pillow==12.1.1",
]
newton-viewer = [
  "newton[examples]>=1.3,<1.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["wind3dgs*"]
namespaces = false

[tool.setuptools.package-data]
wind3dgs = ["py.typed"]
"wind3dgs.contracts" = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
check_untyped_defs = true
